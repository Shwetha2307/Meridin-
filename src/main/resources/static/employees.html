<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>People | Meridian People Suite</title>
  <meta name="theme-color" content="#3256d6">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-title="People">

  <!-- Page Main Content -->
  <main class="page-container">
    <div class="page-hero">
      <div class="hero-titles">
        <h2>People</h2>
        <p>Search, filter, manage records, and inspect organizational reporting relationships.</p>
      </div>
      <div class="hero-actions">
        <button class="btn btn-primary" onclick="openCreateEmployeeModal()">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Employee
        </button>
      </div>
    </div>

    <!-- Search & Filter Controls -->
    <div class="filter-bar">
      <div class="search-box-wrap">
        <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="employee-search" class="form-input" placeholder="Search by name, email, or role...">
      </div>

      <div class="filter-group">
        <select id="employee-dept-filter" class="form-select">
          <option value="">All Departments</option>
        </select>

        <select id="employee-status-filter" class="form-select">
          <option value="">All Statuses</option>
          <option value="ACTIVE">Active</option>
          <option value="ON_LEAVE">On Leave</option>
          <option value="TERMINATED">Terminated</option>
        </select>
      </div>
    </div>

    <!-- Data Table -->
    <div class="table-responsive">
      <table class="data-table">
        <thead>
          <tr>
            <th data-sort="firstName">Employee</th>
            <th data-sort="role">Role & Contact</th>
            <th>Department</th>
            <th>Manager</th>
            <th data-sort="salary">Compensation & Hire Date</th>
            <th data-sort="status">Status</th>
            <th style="text-align: right;">Actions</th>
          </tr>
        </thead>
        <tbody id="employee-table-body">
          <tr><td colspan="7" style="text-align:center; padding: 2rem;">Loading directory...</td></tr>
        </tbody>
      </table>

      <!-- Pagination Bar -->
      <div class="pagination-bar">
        <div>
          Showing <span id="total-emp-count" style="font-weight:700; color:var(--text-main);">0</span> total employee records
        </div>
        <div class="pagination-controls">
          <span id="page-info" style="margin-right: 0.75rem;">Page 1 of 1</span>
          <button id="prev-page-btn" class="btn btn-secondary btn-sm" disabled>&larr; Previous</button>
          <button id="next-page-btn" class="btn btn-secondary btn-sm" disabled>Next &rarr;</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Create/Edit Employee Modal -->
  <div id="employee-modal" class="modal-overlay">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="emp-modal-title">Add New Employee</h3>
        <button class="modal-close-btn" onclick="closeModal('employee-modal')" title="Close">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="employee-form">
        <div class="modal-body">
          <input type="hidden" id="emp-form-id">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">First Name<span class="req">*</span></label>
              <input type="text" id="emp-form-fname" class="form-input form-input-plain" required placeholder="e.g. John">
            </div>

            <div class="form-group">
              <label class="form-label">Last Name<span class="req">*</span></label>
              <input type="text" id="emp-form-lname" class="form-input form-input-plain" required placeholder="e.g. Doe">
            </div>

            <div class="form-group form-full">
              <label class="form-label">Corporate Email<span class="req">*</span></label>
              <input type="email" id="emp-form-email" class="form-input form-input-plain" required placeholder="john.doe@enterprise.io">
            </div>

            <div class="form-group">
              <label class="form-label">Phone Number<span class="req">*</span></label>
              <input type="tel" id="emp-form-phone" class="form-input form-input-plain" required placeholder="+1 (555) 000-0000">
            </div>

            <div class="form-group">
              <label class="form-label">Role Title<span class="req">*</span></label>
              <input type="text" id="emp-form-role" class="form-input form-input-plain" required placeholder="e.g. Senior Staff Engineer">
            </div>

            <div class="form-group">
              <label class="form-label">Hire Date<span class="req">*</span></label>
              <input type="date" id="emp-form-hiredate" class="form-input form-input-plain" required>
            </div>

            <div class="form-group">
              <label class="form-label">Annual Base Salary (USD)<span class="req">*</span></label>
              <input type="number" id="emp-form-salary" class="form-input form-input-plain" required min="1000" step="500" placeholder="125000">
            </div>

            <div class="form-group">
              <label class="form-label">Department<span class="req">*</span></label>
              <select id="emp-form-dept" class="form-select" required>
                <option value="">Select Department</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Status<span class="req">*</span></label>
              <select id="emp-form-status" class="form-select" required>
                <option value="ACTIVE">ACTIVE</option>
                <option value="ON_LEAVE">ON_LEAVE</option>
                <option value="TERMINATED">TERMINATED</option>
              </select>
            </div>

            <div class="form-group form-full">
              <label class="form-label">Reports To (Manager)</label>
              <select id="emp-form-manager" class="form-select">
                <option value="">None (Top Executive)</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('employee-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Employee Record</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Hierarchy Modal -->
  <div id="hierarchy-modal" class="modal-overlay">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3>Reporting Hierarchy & Team Tree</h3>
        <button class="modal-close-btn" onclick="closeModal('hierarchy-modal')" title="Close">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="hierarchy-content">
        <!-- Rendered dynamically by app.js -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('hierarchy-modal')">Close</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initEmployeesPage();
    });
  </script>
</body>
</html>
